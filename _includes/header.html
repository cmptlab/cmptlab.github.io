<!DOCTYPE html>

<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#2774AE">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    
<link rel="stylesheet" href="/static/css/bootstrap.min.css">
    {% if page.group == 'news' %}
    <link rel="alternate" type="application/atom+xml" title="CMPT LAB News Feed" href="/news.xml">
    {% endif %}

    <link href="/static/css/syntax.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <link href="{{ '/static/css/mobile.css' | relative_url }}" rel="stylesheet">
  </head>

  <body{% if page.group %} class="page-{{ page.group }}"{% endif %}>

    <!-- Static navbar -->
    <nav class="navbar navbar-expand-lg navbar-light lab-navbar">
        <a class="navbar-brand lab-navbar-brand" href="/">
          <strong class="cmpt-brand">CMPT LAB</strong>
        </a>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-collapse collapse" id="navbarContent">
          <ul class="navbar-nav ml-auto">
            {% for link in site.data.navigation %}
              {% if page.group == link.group %}
                <li class = "nav-item active"><a class="nav-link" href="{{link.link}}" {% if page.group == link.group %}aria-current="page"{% endif %}> {{link.name}}<span class="sr-only">(current)</span></a></li>
              {% else %}
                <li class="nav-item"><a class="nav-link" href="{{link.link}}" {% if page.group == link.group %}aria-current="page"{% endif %}> {{link.name}}</a></li>
              {% endif %}
            {% endfor %}
          </ul>
        </div><!--/.nav-collapse -->
      </nav>

    <div class="container">
