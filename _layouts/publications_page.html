{% include header.html %}

<style>
.pub-list{max-width:980px}
.pub-list h1{margin-bottom:1.65rem}
.pub-year{color:#2774ae;border-bottom:1px solid #cddbe6;padding-bottom:.55rem;margin:1.8rem 0 .2rem}
.pub-entry{padding:1rem 0;border-bottom:1px solid #e6edf2}
.pub-entry:last-child{border-bottom:0}
.pub-entry h3{font-size:1.12rem;color:#225b81;line-height:1.45;margin:0 0 .3rem}
.pub-number{color:#506979;font-variant-numeric:tabular-nums;margin-right:.55rem}
.pub-entry p{margin:0 0 .2rem}
.pub-meta{color:#4c5660}
.pub-link{white-space:nowrap;margin-left:.45rem}
.pub-filters {display:flex;flex-wrap:wrap;gap:.55rem;margin:0 0 1.5rem}
.pub-filters a {padding:.38rem .8rem;border:1px solid #cddbe6;border-radius:.3rem;color:#225b81;font-weight:600}
.pub-filters a:hover {background:#edf4fa}
.pub-filters a[aria-current="true"] {background:#225b81;color:white;border-color:#225b81}
.pub-filters a:focus-visible {outline:2px solid #2774ae;outline-offset:3px}
.pub-list section[hidden] {display:none}
</style>

<main class="container pub-list pb-4">
  {{ content }}
</main>

<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/popper.min.js"></script>
<script src="/static/js/bootstrap.min.js"></script>
<script>
(() => {
  const filters = Array.from(document.querySelectorAll('.pub-filters a'));
  const groups = Array.from(document.querySelectorAll('.pub-list section[id], .pub-list section[aria-labelledby]'));
  function applyFilter() {
    const hash = window.location.hash.slice(1);
    const year = filters.some(link => link.hash === '#' + hash) ? hash : 'all';
    for (const group of groups) {
      group.hidden = year !== 'all' && group.getAttribute('aria-labelledby') !== 'year-' + year;
    }
    for (const link of filters) {
      if (link.hash === '#' + year) link.setAttribute('aria-current', 'true');
      else link.removeAttribute('aria-current');
    }
  }
  window.addEventListener('hashchange', applyFilter);
  applyFilter();
})();
</script>
</body>
</html>
