{% include header.html %}

<style>
.people-page{max-width:1060px;padding-bottom:3rem}
.people-page h1{margin:1.25rem 0 1.8rem}
.pi-profile{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);align-items:start;gap:2rem}
.pi-photo{display:block;width:100%;height:auto;border-radius:.28rem}
.people-page h2,.people-page h3{color:#225b81}
.pi-role{color:#495057;font-weight:600}
.people-page hr{margin:2rem 0;border-top:1px solid #cddbe6}
.member-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.75rem 1.45rem;margin-top:1.15rem}
.member-grid article{text-align:center}
.member-grid h3{font-size:1.19rem;margin:.7rem 0 .16rem}
.member-grid p{margin:0;color:#495057}
.member-grid .member-cn{font-size:.9rem}
.member-photo{position:relative;overflow:hidden;aspect-ratio:1;width:min(100%,208px);margin:auto;border-radius:.28rem;background:#eef2f5}
.member-photo img{position:absolute;max-width:none;height:auto;display:block}
@media(max-width:670px){.pi-profile{grid-template-columns:1fr;gap:1rem}.pi-photo{max-width:170px}.member-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem .75rem}}
@media(min-width:900px){.member-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.placeholder-photo{background:#e8f2f9}
.avatar-head,.avatar-shoulders{position:absolute;background:#5283a6;left:50%;transform:translateX(-50%)}
.avatar-head{top:21%;width:27%;height:27%;border-radius:50%}
.avatar-shoulders{top:51%;width:57%;height:34%;border-radius:60% 60% 20% 20%}
.alumni-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:2.4rem;list-style:none;margin:1rem 0 0;padding:0}
.alumni-grid li{display:flex;flex-direction:column;gap:.2rem;padding:.65rem 0;border-bottom:1px solid #e6edf2}
.alumni-grid li span:first-child{font-weight:600}
.alumni-grid li span:last-child{color:#495057}
@media(max-width:670px){.alumni-grid{grid-template-columns:1fr}}
@media(min-width:900px){.alumni-grid{grid-template-columns:repeat(3,minmax(0,1fr))}} .pi-email{overflow-wrap:anywhere}
</style>

<main id="people" class="container people-page">
  {{ content }}
</main>

<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/popper.min.js"></script>
<script src="/static/js/bootstrap.min.js"></script>
</body>
</html>
